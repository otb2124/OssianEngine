<p-accordion [multiple]="true">
    <p-accordion-panel *ngFor="let project of projects" [value]="project.id">
  
      <p-accordion-header>
        <app-project-overview [project]="project" />
      </p-accordion-header>
  
      <p-accordion-content>
        <app-project-details
          [project]="project"
          (openFolder)="openInExplorer($event)">
        </app-project-details>
      </p-accordion-content>
  
    </p-accordion-panel>
  </p-accordion>
