<div class="flex w-full items-stretch">

  <!-- Left: controls stacked -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <app-url-control class="shrink-0"></app-url-control>
    <app-module-control class="shrink-0"></app-module-control>

    <!-- Row: Title + tabs -->
    <div class="flex items-center h-10 border-b border-gray-200 dark:border-gray-800 w-full min-w-0">
      <span class="text-sm font-medium text-gray-900 dark:text-white px-4 h-full flex items-center shrink-0">
        {{ this.projectService.projectName() || 'No current project' }}
      </span>
      <div class="flex-1 min-w-0 overflow-x-auto scrollbar-none h-full">
        <app-tabs-control></app-tabs-control>
      </div>
    </div>
  </div>

  <!-- Right: app title spanning full height -->
  <app-title class="flex shrink-0 self-stretch border-l border-gray-200 dark:border-gray-800"></app-title>

</div>
